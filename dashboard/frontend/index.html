<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TraderTMP10 — Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --graphite: #12151C;
    --slate: #1B212C;
    --slate-2: #232A38;
    --slate-3: #2A3242;
    --hairline: #2B3242;
    --ivory: #E9EAEC;
    --muted: #8A93A3;
    --green: #1FAA59;
    --green-dim: #163524;
    --red: #E5484D;
    --red-dim: #3A1B1D;
    --amber: #E8A33D;
    --amber-dim: #3A2E14;
    --blue: #4A9EFF;
    --blue-dim: #16283A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--graphite);
    color:var(--ivory);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .display{font-family:'Space Grotesk', sans-serif;}

  /* ---------- Ticker (signature element) ---------- */
  .ticker-wrap{
    border-bottom:1px solid var(--hairline);
    background:#0D0F15;
    overflow:hidden;
    position:relative;
    height:40px;
    display:flex;
    align-items:center;
  }
  .ticker-wrap.fechado{ filter:grayscale(1); opacity:0.5; }
  .ticker-track{
    display:flex;
    gap:28px;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll-left 38s linear infinite;
  }
  .ticker-wrap.fechado .ticker-track{ animation-play-state:paused; }
  @keyframes scroll-left{ from{ transform:translateX(0); } to{ transform:translateX(-100%); } }
  .ticker-item{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; display:flex; align-items:center; gap:8px; color:var(--muted); }
  .ticker-pill{ padding:2px 8px; border-radius:3px; font-weight:600; font-size:10.5px; letter-spacing:0.03em; }
  .pill-compra{ background:var(--green-dim); color:var(--green); }
  .pill-venda{ background:var(--red-dim); color:var(--red); }
  .pill-aguardar{ background:var(--amber-dim); color:var(--amber); }

  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
  .pulse-dot{ width:7px; height:7px; border-radius:50%; background:var(--amber); animation:pulse 1.8s ease-in-out infinite; flex-shrink:0; }
  @media (prefers-reduced-motion: reduce){ .ticker-track{ animation:none; } .pulse-dot{ animation:none; } }

  /* ---------- Layout ---------- */
  .shell{ max-width:1240px; margin:0 auto; padding:0 24px 64px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 0 16px; flex-wrap:wrap; gap:12px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-logo{ height:112px; width:auto; }
  .brand-mark{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; letter-spacing:-0.01em; }
  .brand-sub{ color:var(--muted); font-size:12px; }
  .top-controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .mode-toggle{ display:flex; border:1px solid var(--hairline); border-radius:8px; overflow:hidden; }
  .mode-btn{ padding:7px 13px; font-size:12px; font-weight:600; font-family:'Space Grotesk',sans-serif; border:none; cursor:pointer; }
  .mode-sim{ background:var(--green-dim); color:var(--green); }
  .mode-real{ background:var(--slate-2); color:var(--muted); cursor:not-allowed; display:flex; align-items:center; gap:5px; }

  .status-chip{ display:flex; align-items:center; gap:8px; padding:7px 14px; border-radius:20px; border:1px solid var(--hairline); font-size:12.5px; }
  .dot{ width:8px; height:8px; border-radius:50%; }
  .dot.on{ background:var(--green); box-shadow:0 0 0 3px var(--green-dim); }
  .dot.off{ background:var(--red); box-shadow:0 0 0 3px var(--red-dim); }
  .btn-sair{ background:none; border:1px solid var(--hairline); color:var(--muted); padding:7px 14px; border-radius:8px; font-size:12.5px; cursor:pointer; }
  .btn-sair:hover{ color:var(--ivory); border-color:var(--muted); }

  /* ---------- Alerts ---------- */
  .alerts-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .alert-item{ display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:8px; font-size:13px; border-left:3px solid; background:var(--slate); }
  .alert-sucesso{ border-color:var(--green); color:var(--green); }
  .alert-alerta{ border-color:var(--red); color:var(--red); }
  .alert-atencao{ border-color:var(--amber); color:var(--amber); }
  .alert-info{ border-color:var(--blue); color:var(--blue); }

  .section-title{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.07em; margin:28px 0 12px; }
  .section-title:first-child{ margin-top:0; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; min-width:0; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; min-width:0; }
  @media (max-width:860px){ .grid2, .grid3{ grid-template-columns:1fr; } }

  .card{ background:var(--slate); border:1px solid var(--hairline); border-radius:12px; padding:20px 22px; min-width:0; }
  .card-title{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin:0 0 14px; display:flex; align-items:center; gap:8px; }

  /* ---------- Score da IA ---------- */
  .score-card{ display:flex; align-items:center; gap:22px; }
  .score-ring{ width:104px; height:104px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:6px solid var(--slate-3); position:relative; }
  .score-number{ font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:600; }
  .score-max{ font-size:13px; color:var(--muted); }
  .score-meta{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .score-verde{ border-color:var(--green); } .score-verde .score-number{ color:var(--green); }
  .score-amarelo{ border-color:var(--amber); } .score-amarelo .score-number{ color:var(--amber); }
  .score-vermelho{ border-color:var(--red); } .score-vermelho .score-number{ color:var(--red); }

  /* ---------- Confiança / fatores ---------- */
  .confianca-bar-track{ height:10px; border-radius:5px; background:var(--slate-2); overflow:hidden; margin-bottom:6px; }
  .confianca-bar-fill{ height:100%; border-radius:5px; background:var(--amber); }
  .confianca-valor{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; margin-bottom:14px; }
  .fator-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .fator-nome{ font-size:12.5px; color:var(--muted); width:88px; flex-shrink:0; }
  .fator-bar-track{ flex:1; height:6px; border-radius:3px; background:var(--slate-2); overflow:hidden; }
  .fator-bar-fill{ height:100%; border-radius:3px; }
  .fator-pct{ font-family:'IBM Plex Mono',monospace; font-size:12px; width:38px; text-align:right; color:var(--ivory); }

  /* ---------- Explicação ---------- */
  .explicacao-card{ border-left:3px solid var(--amber); font-size:14px; line-height:1.6; color:var(--ivory); opacity:0.92; font-style:italic; }

  /* ---------- Checklist ---------- */
  .checklist-item{ display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--hairline); font-size:13px; }
  .checklist-item:last-child{ border-bottom:none; }
  .checklist-icon{ width:18px; height:18px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; margin-top:1px; }
  .checklist-ok{ background:var(--green-dim); color:var(--green); }
  .checklist-fail{ background:var(--red-dim); color:var(--red); }
  .checklist-texto b{ display:block; font-weight:600; }
  .checklist-texto span{ color:var(--muted); font-size:12px; }

  /* ---------- Semáforo ---------- */
  .semaforo-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  @media (max-width:700px){ .semaforo-grid{ grid-template-columns:repeat(2,1fr); } }
  .semaforo-item{ text-align:center; padding:14px 8px; border-radius:10px; background:var(--slate-2); }
  .semaforo-luz{ width:16px; height:16px; border-radius:50%; margin:0 auto 8px; }
  .luz-FAVORAVEL{ background:var(--green); box-shadow:0 0 10px var(--green); }
  .luz-ATENCAO{ background:var(--amber); box-shadow:0 0 10px var(--amber); }
  .luz-DESFAVORAVEL{ background:var(--red); box-shadow:0 0 10px var(--red); }
  .semaforo-dimensao{ font-size:12px; font-weight:600; }
  .semaforo-detalhe{ font-size:10.5px; color:var(--muted); margin-top:4px; line-height:1.3; }

  /* ---------- Atividade da IA ---------- */
  .activity-strip{ display:flex; align-items:center; gap:10px; padding:12px 18px; background:var(--slate); border:1px solid var(--hairline); border-radius:10px; font-size:13px; color:var(--amber); font-family:'IBM Plex Mono',monospace; }

  /* ---------- Operação: níveis ---------- */
  .op-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .lado-badge{ font-weight:700; font-size:14px; padding:4px 12px; border-radius:6px; }
  .lado-COMPRA{ background:var(--green-dim); color:var(--green); }
  .lado-VENDA{ background:var(--red-dim); color:var(--red); }
  .op-preco{ font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:600; }
  .niveis-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:10px; margin-bottom:16px; }
  .nivel-box{ background:var(--slate-2); border-radius:8px; padding:10px 12px; text-align:center; }
  .nivel-label{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
  .nivel-valor{ font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; margin-top:4px; }
  .nivel-stop .nivel-valor{ color:var(--red); }
  .nivel-alvo .nivel-valor{ color:var(--green); }
  .op-linha{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:6px; }
  .op-motivos{ margin-top:14px; padding-top:14px; border-top:1px solid var(--hairline); }
  .motivo{ font-size:13px; color:var(--ivory); opacity:0.85; padding:3px 0; position:relative; padding-left:14px; }
  .motivo::before{ content:'—'; position:absolute; left:0; color:var(--muted); }
  .op-vazia{ color:var(--muted); font-size:14px; padding:18px 0; text-align:center; }

  /* ---------- Stats ---------- */
  .stat-box{ background:var(--slate); border:1px solid var(--hairline); border-radius:12px; padding:16px 18px; }
  .stat-label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .stat-value{ font-family:'IBM Plex Mono',monospace; font-size:21px; margin-top:6px; font-weight:600; }
  .stat-value.pos{ color:var(--green); } .stat-value.neg{ color:var(--red); }
  .stat-sub{ font-size:11.5px; color:var(--muted); margin-top:4px; }
  .mini-stats-row{ display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; }
  .mini-stat{ font-size:11.5px; color:var(--muted); }
  .mini-stat b{ color:var(--ivory); font-family:'IBM Plex Mono',monospace; font-weight:500; }

  /* ---------- Evolução da IA ---------- */
  .evo-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  .evo-item-label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
  .evo-item-valor{ font-family:'IBM Plex Mono',monospace; font-size:17px; margin-top:5px; }
  .evo-item-valor.indisponivel{ color:var(--muted); font-style:italic; font-size:13px; font-family:'IBM Plex Sans',sans-serif; }

  /* ---------- Tabelas ---------- */
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; padding:0 10px 10px 0; border-bottom:1px solid var(--hairline); }
  td{ padding:9px 10px 9px 0; border-bottom:1px solid var(--hairline); font-family:'IBM Plex Mono',monospace; }
  tr:last-child td{ border-bottom:none; }
  .resultado.pos{ color:var(--green); } .resultado.neg{ color:var(--red); }
  .motivo-cell{ font-family:'IBM Plex Sans',sans-serif; font-size:11.5px; color:var(--muted); max-width:260px; }

  /* ---------- Cronômetros ---------- */
  .cronometros-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:860px){ .cronometros-grid{ grid-template-columns:repeat(2,1fr); } }
  .cronometro-box{ background:var(--slate-2); border-radius:10px; padding:14px 16px; text-align:center; }
  .cronometro-label{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
  .cronometro-valor{ font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; margin-top:6px; }
  .cronometro-valor.urgente{ color:var(--red); }

  /* ---------- Resultado em tempo real ---------- */
  .resultado-tempo-real{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:600px){ .resultado-tempo-real{ grid-template-columns:1fr; } }
  .rtr-box{ text-align:center; padding:16px; background:var(--slate-2); border-radius:10px; }
  .rtr-label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
  .rtr-valor{ font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:600; margin-top:6px; }
  .rtr-valor.pos{ color:var(--green); } .rtr-valor.neg{ color:var(--red); }

  /* ---------- Gráficos de barra (performance) ---------- */
  .bar-chart{ display:flex; align-items:flex-end; gap:6px; height:140px; padding-top:10px; overflow-x:auto; }
  .bar-col{ flex:1; min-width:38px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .bar-track{ width:100%; max-width:34px; flex:1; display:flex; align-items:flex-end; }
  .bar-fill{ width:100%; border-radius:4px 4px 0 0; min-height:2px; transition:height 0.3s ease; }
  .bar-fill.pos{ background:var(--green); } .bar-fill.neg{ background:var(--red); } .bar-fill.zero{ background:var(--slate-3); }
  .bar-label{ font-size:10.5px; color:var(--muted); margin-top:6px; }
  .bar-value{ font-size:10px; font-family:'IBM Plex Mono',monospace; color:var(--muted); margin-top:2px; }

  /* ---------- Comparação IA vs mercado ---------- */
  .comp-icone{ width:20px; height:20px; border-radius:5px; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
  .comp-acertou{ background:var(--green-dim); color:var(--green); }
  .comp-errou{ background:var(--red-dim); color:var(--red); }

  /* ---------- Configurações ---------- */
  .config-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  @media (max-width:700px){ .config-grid{ grid-template-columns:1fr; } }
  .config-field{ margin-bottom:14px; }
  .config-field label{ font-size:12px; color:var(--muted); display:block; margin-bottom:6px; }
  .config-field input[type="number"], .config-field input[type="time"]{ margin-bottom:0; }
  .dias-semana{ display:flex; gap:6px; flex-wrap:wrap; }
  .dia-chip{ padding:6px 12px; border-radius:6px; border:1px solid var(--hairline); background:var(--slate-2); font-size:12px; cursor:pointer; color:var(--muted); }
  .dia-chip.ativo{ background:var(--green-dim); color:var(--green); border-color:var(--green); }
  .btn-salvar-config{ padding:10px 20px; background:var(--amber); color:#1A1204; border:none; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; font-family:'Space Grotesk',sans-serif; }
  .btn-salvar-config:hover{ filter:brightness(1.08); }
  .config-salvo-msg{ font-size:12.5px; color:var(--green); margin-left:12px; }
  .modo-radio{ display:flex; gap:10px; }
  .modo-radio-btn{ flex:1; padding:10px; border-radius:8px; border:1px solid var(--hairline); text-align:center; font-size:12.5px; font-weight:600; }
  .modo-radio-btn.sim-ativo{ background:var(--green-dim); color:var(--green); border-color:var(--green); }
  .modo-radio-btn.real-bloqueado{ background:var(--slate-2); color:var(--muted); cursor:not-allowed; }

  /* ---------- Responsividade adicional ---------- */
  @media (max-width:600px){
    .shell{ padding:0 14px 48px; }
    .brand-mark{ font-size:16px; }
    .score-card{ flex-direction:column; text-align:center; }
    table{ font-size:11px; }
    .card{ padding:16px; }
    .top-controls{ width:100%; justify-content:space-between; }
  }
  .table-scroll{ overflow-x:auto; }
  .table-scroll table{ min-width:640px; }
  .login-shell{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 30% 20%, #1a2030 0%, var(--graphite) 60%); }
  .login-card{ width:460px; background:var(--slate); border:1px solid var(--hairline); border-radius:14px; padding:34px 30px; }
  .login-logo{ width:360px; max-width:100%; display:block; margin:0 auto 8px; }
  .login-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; margin-bottom:4px; }
  .login-sub{ color:var(--muted); font-size:13px; margin-bottom:24px; }
  .field-label{ font-size:12.5px; color:var(--muted); margin-bottom:6px; display:block; }
  input{ width:100%; padding:10px 12px; margin-bottom:16px; background:var(--slate-2); border:1px solid var(--hairline); border-radius:8px; color:var(--ivory); font-size:14px; font-family:'IBM Plex Sans',sans-serif; }
  input:focus{ outline:2px solid var(--amber); outline-offset:1px; border-color:transparent; }
  .btn-entrar{ width:100%; padding:11px; background:var(--amber); color:#1A1204; border:none; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer; font-family:'Space Grotesk',sans-serif; }
  .btn-entrar:hover{ filter:brightness(1.08); }
  .btn-entrar:disabled{ opacity:0.6; cursor:default; }
  .erro-login{ color:var(--red); font-size:13px; margin-bottom:14px; }
  .loading-shell{ min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--muted); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

/* =====================================================================
   CONFIGURAÇÃO — edite estes três valores antes de publicar o site.
   ===================================================================== */
const SUPABASE_URL = "https://yxntkmjhmdzymeupqxwe.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yj73AvGrHtapwyw5qCksVQ_B0Uez8iH";
const API_BASE_URL = "https://traderia-win-backend-production.up.railway.app"; // backend TraderIA WIN no Railway

function formatBRL(v) {
  if (v === null || v === undefined) return "—";
  const sinal = v > 0 ? "+" : "";
  return sinal + v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function formatDuracao(segundosTotais) {
  if (segundosTotais === null || segundosTotais === undefined || segundosTotais < 0) return "—";
  const h = Math.floor(segundosTotais / 3600);
  const m = Math.floor((segundosTotais % 3600) / 60);
  const s = Math.floor(segundosTotais % 60);
  return h > 0
    ? `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
    : `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function corPorScore(score) {
  if (score >= 80) return { classe: "score-verde", cor: "var(--green)" };
  if (score >= 60) return { classe: "score-amarelo", cor: "var(--amber)" };
  return { classe: "score-vermelho", cor: "var(--red)" };
}
const CORES_FATOR = { tendencia: "var(--green)", momentum: "var(--blue)", fluxo: "var(--amber)", volume: "var(--green)", volatilidade: "var(--red)", contexto: "var(--blue)" };
const NOMES_FATOR = { tendencia: "Tendência", momentum: "Momentum", fluxo: "Fluxo", volume: "Volume", volatilidade: "Volatilidade", contexto: "Contexto" };

/* ---------------------- Tela de login ---------------------- */
function TelaLogin({ onEntrou }) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  async function entrar(e) {
    e.preventDefault();
    setErro(""); setCarregando(true);
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
    setCarregando(false);
    if (error) { setErro(error.message); return; }
    onEntrou(data.session);
  }

  return (
    <div className="login-shell">
      <div className="login-card">
        <img src={LOGO_LOGIN} alt="TraderTMP10" className="login-logo" />
        <div className="login-sub" style={{textAlign:"center", marginTop:-6}}>Painel de acompanhamento — Mini Índice</div>
        {erro && <div className="erro-login">{erro}</div>}
        <form onSubmit={entrar}>
          <label className="field-label">E-mail</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required />
          <label className="field-label">Senha</label>
          <input type="password" value={senha} onChange={e=>setSenha(e.target.value)} required />
          <button className="btn-entrar" disabled={carregando}>{carregando ? "Entrando..." : "Entrar"}</button>
        </form>
      </div>
    </div>
  );
}

/* ---------------------- Ticker de decisões ---------------------- */
function TickerDecisoes({ decisoes, pregaoAberto }) {
  const itens = decisoes.length ? decisoes : [{ decisao: "AGUARDAR", ativo: "WINFUT", confianca: 0, timestamp: new Date().toISOString() }];
  const dobrado = [...itens, ...itens];
  const pillClass = { COMPRAR: "pill-compra", VENDER: "pill-venda", AGUARDAR: "pill-aguardar" };
  return (
    <div className={"ticker-wrap" + (pregaoAberto ? "" : " fechado")}>
      <div className="ticker-track">
        {dobrado.map((d, i) => (
          <div className="ticker-item" key={i}>
            <span className={"ticker-pill " + pillClass[d.decisao]}>{d.decisao}</span>
            <span>{d.ativo}</span>
            <span>score {d.score_ia !== undefined ? d.score_ia.toFixed(0) : "—"}</span>
            <span>{new Date(d.timestamp).toLocaleTimeString("pt-BR")}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------------- Alertas ---------------------- */
function Alertas({ alertas }) {
  if (!alertas || !alertas.length) return null;
  return (
    <div className="alerts-row">
      {alertas.filter(a => a.tipo !== "CONEXAO").map((a, i) => (
        <div className={"alert-item alert-" + a.severidade} key={i}>{a.mensagem}</div>
      ))}
    </div>
  );
}

/* ---------------------- Score + Confiança ---------------------- */
function ScoreEConfianca({ decisao }) {
  const score = decisao?.score_ia ?? 0;
  const { classe } = corPorScore(score);
  const fatores = decisao?.fatores || {};
  const confiancaPct = decisao ? Math.round((decisao.confianca || 0) * 100) : 0;

  return (
    <div className="grid2">
      <div className="card">
        <div className="card-title">🧠 Score da IA</div>
        <div className="score-card">
          <div className={"score-ring " + classe}>
            <div style={{textAlign:"center"}}>
              <div className="score-number">{score.toFixed(0)}</div>
              <div className="score-max">/100</div>
            </div>
          </div>
          <div>
            <div className="score-meta">{decisao ? decisao.atividade_ia : "Aguardando primeira análise…"}</div>
            <div className="score-meta" style={{marginTop:8}}>
              {score >= 80 ? "Score favorável — IA autorizada a operar" :
               score >= 60 ? "Score em zona de atenção" :
               "Score abaixo do mínimo — IA não deve operar"}
            </div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-title">Confiança da decisão</div>
        <div className="confianca-bar-track">
          <div className="confianca-bar-fill" style={{width: confiancaPct + "%"}} />
        </div>
        <div className="confianca-valor">{confiancaPct}%</div>
        {Object.keys(fatores).length === 0 ? (
          <div style={{color:"var(--muted)", fontSize:13}}>Sem fatores calculados ainda.</div>
        ) : (
          Object.entries(fatores).map(([nome, valor]) => (
            <div className="fator-row" key={nome}>
              <span className="fator-nome">{NOMES_FATOR[nome] || nome}</span>
              <div className="fator-bar-track">
                <div className="fator-bar-fill" style={{width: valor + "%", background: CORES_FATOR[nome] || "var(--amber)"}} />
              </div>
              <span className="fator-pct">{valor.toFixed(0)}%</span>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

/* ---------------------- Explicação + Checklist + Semáforo ---------------------- */
function ExplicacaoEChecklist({ decisao, checklist, semaforo }) {
  return (
    <React.Fragment>
      <div className="card explicacao-card" style={{marginBottom:16}}>
        {decisao?.explicacao || "A IA ainda não gerou nenhuma explicação — aguardando a primeira análise de mercado."}
      </div>
      <div className="grid2">
        <div className="card">
          <div className="card-title">Checklist da operação</div>
          {(!checklist || checklist.length === 0) ? (
            <div className="op-vazia">Sem checklist disponível ainda.</div>
          ) : checklist.map((item, i) => (
            <div className="checklist-item" key={i}>
              <span className={"checklist-icon " + (item.aprovado ? "checklist-ok" : "checklist-fail")}>{item.aprovado ? "✓" : "✕"}</span>
              <div className="checklist-texto"><b>{item.item}</b><span>{item.detalhe}</span></div>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="card-title">Semáforo do mercado</div>
          <div className="semaforo-grid">
            {(semaforo || []).map((item, i) => (
              <div className="semaforo-item" key={i}>
                <div className={"semaforo-luz luz-" + item.status}></div>
                <div className="semaforo-dimensao">{item.dimensao}</div>
                <div className="semaforo-detalhe">{item.detalhe}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ---------------------- Cronômetros ---------------------- */
function Cronometros({ status, operacoesAbertas }) {
  const [agora, setAgora] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setAgora(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const segsDesde = (isoString) => isoString ? Math.floor((agora - new Date(isoString).getTime()) / 1000) : null;

  const operacaoMaisRecente = operacoesAbertas && operacoesAbertas.length > 0 ? operacoesAbertas[0] : null;
  const tempoOperacao = operacaoMaisRecente ? segsDesde(operacaoMaisRecente.timestamp_entrada) : null;
  const tempoUltimaEntrada = segsDesde(status?.cronometro?.ultima_entrada);
  const tempoUltimoTrade = segsDesde(status?.cronometro?.ultimo_trade_fechado);

  let tempoRestantePregao = null;
  if (status?.pregao?.horario_fechamento && status?.pregao?.aberto) {
    const [h, m, s] = status.pregao.horario_fechamento.split(":").map(Number);
    const agoraDate = new Date();
    const fechamento = new Date(agoraDate);
    fechamento.setHours(h, m, s || 0, 0);
    tempoRestantePregao = Math.floor((fechamento.getTime() - agoraDate.getTime()) / 1000);
  }

  return (
    <div className="card">
      <div className="card-title">⏱ Cronômetro</div>
      <div className="cronometros-grid">
        <div className="cronometro-box"><div className="cronometro-label">Tempo da operação</div><div className="cronometro-valor">{formatDuracao(tempoOperacao)}</div></div>
        <div className="cronometro-box"><div className="cronometro-label">Desde a última entrada</div><div className="cronometro-valor">{formatDuracao(tempoUltimaEntrada)}</div></div>
        <div className="cronometro-box"><div className="cronometro-label">Desde o último trade</div><div className="cronometro-valor">{formatDuracao(tempoUltimoTrade)}</div></div>
        <div className="cronometro-box"><div className="cronometro-label">Até o fechamento</div><div className={"cronometro-valor " + (tempoRestantePregao !== null && tempoRestantePregao < 900 ? "urgente" : "")}>{tempoRestantePregao !== null ? formatDuracao(tempoRestantePregao) : "Pregão fechado"}</div></div>
      </div>
    </div>
  );
}

/* ---------------------- Resultado em tempo real ---------------------- */
function ResultadoTempoReal({ resultados }) {
  if (!resultados || resultados.length === 0) return null;
  return (
    <React.Fragment>
      {resultados.map((resultado, i) => {
        if (!resultado.disponivel) {
          return <div className="card" style={{marginBottom:12}} key={i}><div className="card-title">Resultado em tempo real — {resultado.ativo}</div><div className="op-vazia">Aguardando preço mais recente da IA para calcular o resultado.</div></div>;
        }
        const positivo = resultado.pontos >= 0;
        return (
          <div className="card" style={{marginBottom:12}} key={i}>
            <div className="card-title">Resultado em tempo real — {resultado.ativo}</div>
            <div className="resultado-tempo-real">
              <div className="rtr-box"><div className="rtr-label">Pontos</div><div className={"rtr-valor " + (positivo?"pos":"neg")}>{positivo?"+":""}{resultado.pontos}</div></div>
              <div className="rtr-box"><div className="rtr-label">Financeiro</div><div className={"rtr-valor " + (positivo?"pos":"neg")}>{formatBRL(resultado.financeiro)}</div></div>
              <div className="rtr-box"><div className="rtr-label">Percentual</div><div className={"rtr-valor " + (positivo?"pos":"neg")}>{positivo?"+":""}{resultado.percentual}%</div></div>
            </div>
          </div>
        );
      })}
    </React.Fragment>
  );
}

/* ---------------------- Gráfico de barras (performance) ---------------------- */
function GraficoBarras({ dados, chaveLabel, chaveValor, chaveQtd, chaveWinRate }) {
  if (!dados || dados.length === 0) return <div className="op-vazia">Sem dados suficientes ainda.</div>;
  const maxAbs = Math.max(1, ...dados.map(d => Math.abs(d[chaveValor])));
  return (
    <div className="bar-chart">
      {dados.map((d, i) => {
        const valor = d[chaveValor];
        const alturaPct = Math.max(4, (Math.abs(valor) / maxAbs) * 100);
        const classe = valor > 0 ? "pos" : valor < 0 ? "neg" : "zero";
        return (
          <div className="bar-col" key={i} title={`${d[chaveLabel]}: ${formatBRL(valor)}${chaveQtd ? " · " + d[chaveQtd] + " trades" : ""}${chaveWinRate ? " · " + d[chaveWinRate] + "% acerto" : ""}`}>
            <div className="bar-track"><div className={"bar-fill " + classe} style={{height: alturaPct + "%"}}></div></div>
            <div className="bar-label">{d[chaveLabel]}</div>
            <div className="bar-value">{formatBRL(valor)}</div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------------- Comparação IA vs mercado ---------------------- */
function ComparacaoIAMercado({ comparacao }) {
  return (
    <div className="card">
      <div className="card-title">Comparação IA vs. Mercado</div>
      {(!comparacao || comparacao.length === 0) ? (

/* ---------------------- Painel de configurações ---------------------- */
const NOMES_DIAS = ["Seg", "Ter", "Qua", "Qui", "Sex"];

function PainelConfiguracoes({ config, onSalvar }) {
  const [form, setForm] = useState(config);
  const [salvo, setSalvo] = useState(false);

  useEffect(() => { setForm(config); }, [config]);

  if (!form) return null;

  function atualizar(campo, valor) {
    setForm({ ...form, [campo]: valor });
    setSalvo(false);
  }

  function alternarDia(dia) {
    const atual = form.dias_permitidos || [];
    const novo = atual.includes(dia) ? atual.filter(d => d !== dia) : [...atual, dia].sort();
    atualizar("dias_permitidos", novo);
  }

  async function salvar() {
    await onSalvar(form);
    setSalvo(true);
  }

  return (
    <div className="card">
      <div className="card-title">Painel de configurações</div>
      <div className="config-grid">
        <div>
          <div className="config-field"><label>Score mínimo para operar</label><input type="number" value={form.score_minimo} onChange={e=>atualizar("score_minimo", Number(e.target.value))} /></div>
          <div className="config-field"><label>Stop diário (R$)</label><input type="number" value={form.stop_diario} onChange={e=>atualizar("stop_diario", Number(e.target.value))} /></div>
          <div className="config-field"><label>Meta diária (R$)</label><input type="number" value={form.meta_diaria} onChange={e=>atualizar("meta_diaria", Number(e.target.value))} /></div>
          <div className="config-field"><label>Risco por operação (R$)</label><input type="number" value={form.risco_por_operacao} onChange={e=>atualizar("risco_por_operacao", Number(e.target.value))} /></div>
        </div>
        <div>
          <div className="config-field"><label>Quantidade máxima de contratos</label><input type="number" min="1" value={form.max_contratos} onChange={e=>atualizar("max_contratos", Number(e.target.value))} /></div>
          <div className="config-field"><label>Horário permitido</label>
            <div style={{display:"flex", gap:8}}>
              <input type="time" value={form.horario_abertura} onChange={e=>atualizar("horario_abertura", e.target.value)} />
              <input type="time" value={form.horario_fechamento} onChange={e=>atualizar("horario_fechamento", e.target.value)} />
            </div>
          </div>
          <div className="config-field"><label>Dias permitidos</label>
            <div className="dias-semana">
              {NOMES_DIAS.map((nome, i) => (
                <div key={i} className={"dia-chip " + ((form.dias_permitidos||[]).includes(i) ? "ativo" : "")} onClick={()=>alternarDia(i)}>{nome}</div>
              ))}
            </div>
          </div>
          <div className="config-field"><label>Modo</label>
            <div className="modo-radio">
              <div className="modo-radio-btn sim-ativo">SIMULAÇÃO</div>
              <div className="modo-radio-btn real-bloqueado" title="Envio de ordens reais ainda não implementado">🔒 REAL</div>
            </div>
          </div>
        </div>
      </div>
      <button className="btn-salvar-config" onClick={salvar}>Salvar configurações</button>
      {salvo && <span className="config-salvo-msg">Configurações salvas ✓</span>}
    </div>
  );
}

/* ---------------------- Evolução da IA ---------------------- */

        <div><div className="evo-item-label">Padrões identificados</div><div className="evo-item-valor">{(evolucao.padroes_identificados||[]).join(", ") || "—"}</div></div>

        <div><div className="evo-item-label">Precisão em simulação</div><div className={"evo-item-valor " + (evolucao.precisao_simulacao===null?"indisponivel":"")}>{evolucao.precisao_simulacao !== null ? evolucao.precisao_simulacao + "%" : "sem operações fechadas ainda"}</div></div>

/* ---------------------- Painel principal ---------------------- */
class LimiteDeErro extends React.Component {
  constructor(props) {
    super(props);
    this.state = { comErro: false };
  }
  static getDerivedStateFromError() {
    return { comErro: true };
  }
  componentDidCatch(erro, info) {
    console.error("Erro capturado pelo LimiteDeErro:", erro, info);
  }
  render() {
    if (this.state.comErro) {
      return (
        <div className="card" style={{border:"1px solid #e5484d"}}>
          <div style={{color:"#e5484d", fontWeight:600, marginBottom:6}}>Essa seção não conseguiu carregar</div>
          <div style={{fontSize:13, color:"var(--text-dim)"}}>O resto da página continua funcionando normalmente. Recarregar a página costuma resolver.</div>
        </div>
      );
    }
    return this.props.children;
  }
}

  const [alertas, setAlertas] = useState([]);

  const [diario, setDiario] = useState([]);
  const [resultadosOperacoes, setResultadosOperacoes] = useState([]);
  const [perfHorario, setPerfHorario] = useState([]);
  const [perfDia, setPerfDia] = useState([]);
  const [comparacao, setComparacao] = useState([]);
  const [config, setConfig] = useState(null);
  const [erroApi, setErroApi] = useState("");

  const carregarDados = useCallback(async () => {
    try {
      const [statusRes, decRes, opRes, statsRes, tickerRes, semRes, alertRes, evoRes, diarioRes, resOpRes, perfHRes, perfDRes, compRes, configRes] = await Promise.all([
        fetch(`${API_BASE_URL}/dashboard/status`).then(r => r.json()),

        fetch(`${API_BASE_URL}/dashboard/operacao-atual`).then(r => r.json()),
        fetch(`${API_BASE_URL}/dashboard/estatisticas`).then(r => r.json()),
        fetch(`${API_BASE_URL}/dashboard/decisoes-recentes?limite=15`).then(r => r.json()),
        fetch(`${API_BASE_URL}/dashboard/semaforo`).then(r => r.json()),
        fetch(`${API_BASE_URL}/dashboard/alertas`).then(r => r.json()),
        fetch(`${API_BASE_URL}/dashboard/evolucao-ia`).then(r => r.json()),
        fetch(`${API_BASE_URL}/dashboard/diario-ia?limite=20`).then(r => r.json()),
        fetch(`${API_BASE_URL}/dashboard/resultado-operacao`).then(r => r.json()),
        fetch(`${API_BASE_URL}/dashboard/performance-horario`).then(r => r.json()),
        fetch(`${API_BASE_URL}/dashboard/performance-dia-semana`).then(r => r.json()),
        fetch(`${API_BASE_URL}/dashboard/comparacao-ia-mercado?limite=15`).then(r => r.json()),
        fetch(`${API_BASE_URL}/dashboard/configuracoes`).then(r => r.json()),

      setStatus(statusRes);
      setDecisaoAtual(decRes.decisao);
      setOperacoesAbertas(opRes.operacoes_abertas || []);

      setDecisoesTicker(tickerRes.decisoes || []);
      setSemaforo(semRes.semaforo || []);
      setAlertas(alertRes.alertas || []);
      setEvolucao(evoRes);

      setResultadosOperacoes(resOpRes.resultados || []);

      setConfig(configRes);

/* ---------------------- Configuração de Estratégia (contratos/pontos) ---------------------- */
function ConfiguracaoEstrategiaAtivo({ ativo, config, onSalvar }) {
  const [form, setForm] = useState(config);
  const [salvo, setSalvo] = useState(false);

  useEffect(() => { setForm(config); }, [config]);
  if (!form) return null;

  function atualizar(campo, valor) {
    setForm({ ...form, [campo]: valor });
    setSalvo(false);
  }
  function atualizarAlvo(i, valor) {
    const novos = [...form.alvos_pontos];
    novos[i] = Number(valor);
    atualizar("alvos_pontos", novos);
  }
  function adicionarAlvo() {
    atualizar("alvos_pontos", [...form.alvos_pontos, 0]);
  }
  function removerAlvo(i) {
    atualizar("alvos_pontos", form.alvos_pontos.filter((_, idx) => idx !== i));
  }
  async function salvar() {
    await onSalvar(form);
    setSalvo(true);
  }

  return (
    <div className="card" style={{marginBottom:16}}>
      <div className="card-title">{ativo}</div>
      <div className="config-grid">
        <div>
          <div className="config-field"><label>Quantidade de contratos</label><input type="number" min="1" value={form.quantidade_contratos} onChange={e=>atualizar("quantidade_contratos", Number(e.target.value))} /></div>
          <div className="config-field"><label>Stop inicial (pontos)</label><input type="number" step="1" value={form.stop_inicial_pontos} onChange={e=>atualizar("stop_inicial_pontos", Number(e.target.value))} /></div>
        </div>
        <div>
          <div className="config-field"><label>Início do trailing (pontos)</label><input type="number" step="1" value={form.inicio_trailing_pontos} onChange={e=>atualizar("inicio_trailing_pontos", Number(e.target.value))} /></div>
          <div className="config-field"><label>Passo do trailing (pontos)</label><input type="number" step="1" value={form.passo_trailing_pontos} onChange={e=>atualizar("passo_trailing_pontos", Number(e.target.value))} /></div>
        </div>
      </div>

      <div style={{marginTop:12}}>
        <label style={{fontSize:13, color:"var(--text-dim)"}}>Alvos de saída (1 por contrato "fatiado" — em pontos). Contratos a mais que a quantidade de alvos ficam "correndo" com o trailing.</label>
        {form.alvos_pontos.map((alvo, i) => (
          <div key={i} style={{display:"flex", gap:8, marginTop:6, alignItems:"center"}}>
            <span style={{fontSize:13, color:"var(--text-dim)", minWidth:70}}>Contrato {i+1}</span>
            <input type="number" step="1" value={alvo} onChange={e=>atualizarAlvo(i, e.target.value)} style={{flex:1}} />
            <button onClick={()=>removerAlvo(i)} className="btn-sair" style={{padding:"6px 10px"}}>×</button>
          </div>
        ))}
        <button onClick={adicionarAlvo} className="btn-salvar-config" style={{marginTop:8, padding:"6px 14px", fontSize:13}}>+ Adicionar alvo</button>
      </div>

      <button className="btn-salvar-config" style={{marginTop:16}} onClick={salvar}>Salvar {ativo}</button>
      {salvo && <span className="config-salvo-msg">Salvo ✓</span>}
    </div>
  );
}

function ConfiguracaoEstrategia() {
  const [configWin, setConfigWin] = useState(null);
  const [configWdo, setConfigWdo] = useState(null);

  async function carregar() {
    try {
      const [win, wdo] = await Promise.all([
        fetch(`${API_BASE_URL}/dashboard/estrategia/WIN`).then(r=>r.json()),
        fetch(`${API_BASE_URL}/dashboard/estrategia/WDO`).then(r=>r.json()),
      ]);
      setConfigWin(win && Array.isArray(win.alvos_pontos) ? win : null);
      setConfigWdo(wdo && Array.isArray(wdo.alvos_pontos) ? wdo : null);
    } catch (e) { console.error("Erro ao carregar configuração de estratégia", e); }
  }
  useEffect(() => { carregar(); }, []);

  async function salvarAtivo(ativo, form) {
    try {
      const resp = await fetch(`${API_BASE_URL}/dashboard/estrategia/${ativo}`, {
        method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(form),
      });
      const salvo = await resp.json();
      if (ativo === "WIN") setConfigWin(salvo); else setConfigWdo(salvo);
    } catch (e) { console.error("Erro ao salvar configuração de estratégia", e); }
  }

  return (
    <React.Fragment>
      <ConfiguracaoEstrategiaAtivo ativo="WIN" config={configWin} onSalvar={(f)=>salvarAtivo("WIN", f)} />
      <ConfiguracaoEstrategiaAtivo ativo="WDO" config={configWdo} onSalvar={(f)=>salvarAtivo("WDO", f)} />
    </React.Fragment>
  );
}

/* ---------------------- Custos Operacionais ---------------------- */
function LinhaCustoOperacional({ custo, onEditar, onExcluir, onDuplicar, onAlternarStatus }) {
  const [editando, setEditando] = useState(false);
  const [form, setForm] = useState(custo);

  function atualizar(campo, valor) { setForm({ ...form, [campo]: valor }); }
  function atualizarTaxaExtra(i, campo, valor) {
    const novas = [...(form.outras_taxas||[])];
    novas[i] = { ...novas[i], [campo]: valor };
    atualizar("outras_taxas", novas);
  }
  function adicionarTaxaExtra() { atualizar("outras_taxas", [...(form.outras_taxas||[]), {nome:"", valor:0}]); }
  function removerTaxaExtra(i) { atualizar("outras_taxas", form.outras_taxas.filter((_,idx)=>idx!==i)); }

  async function salvar() {
    await onEditar(custo.id, form);
    setEditando(false);
  }

  const taxaTotalPreview = (Number(form.corretagem||0)+Number(form.emolumentos||0)+Number(form.registro||0)+Number(form.liquidacao||0)+Number(form.iss||0)+(form.outras_taxas||[]).reduce((s,t)=>s+Number(t.valor||0),0));

  if (!editando) {
    return (
      <tr style={{borderTop:"1px solid var(--hairline)", opacity: custo.ativo_padrao ? 1 : 0.5}}>
        <td style={{padding:"8px"}}>{custo.ativo}</td>
        <td style={{padding:"8px"}}>{custo.corretora}</td>
        <td style={{padding:"8px"}} className="mono">{formatBRL(custo.taxa_total_contrato)}</td>
        <td style={{padding:"8px"}}>{custo.ativo_padrao ? "Ativo" : "Inativo"}</td>
        <td style={{padding:"8px", display:"flex", gap:6, flexWrap:"wrap"}}>
          <button onClick={()=>setEditando(true)} className="btn-salvar-config" style={{padding:"4px 10px", fontSize:12}}>Editar</button>
          <button onClick={()=>onDuplicar(custo.id)} className="btn-salvar-config" style={{padding:"4px 10px", fontSize:12}}>Duplicar</button>
          <button onClick={()=>onAlternarStatus(custo.id, !custo.ativo_padrao)} className="btn-salvar-config" style={{padding:"4px 10px", fontSize:12}}>{custo.ativo_padrao ? "Inativar" : "Ativar"}</button>
          <button onClick={()=>onExcluir(custo.id)} className="btn-sair" style={{padding:"4px 10px", fontSize:12}}>Excluir</button>
        </td>
      </tr>
    );
  }

  return (
    <tr style={{borderTop:"1px solid var(--hairline)"}}>
      <td colSpan="5" style={{padding:"12px", background:"var(--slate-2)"}}>
        <div className="config-grid">
          <div>
            <div className="config-field"><label>Ativo</label><input value={form.ativo} onChange={e=>atualizar("ativo", e.target.value)} /></div>
            <div className="config-field"><label>Corretora</label><input value={form.corretora} onChange={e=>atualizar("corretora", e.target.value)} /></div>
            <div className="config-field"><label>Corretagem (R$)</label><input type="number" step="0.01" value={form.corretagem} onChange={e=>atualizar("corretagem", Number(e.target.value))} /></div>
          </div>
          <div>
            <div className="config-field"><label>Emolumentos (R$)</label><input type="number" step="0.01" value={form.emolumentos} onChange={e=>atualizar("emolumentos", Number(e.target.value))} /></div>
            <div className="config-field"><label>Registro (R$)</label><input type="number" step="0.01" value={form.registro} onChange={e=>atualizar("registro", Number(e.target.value))} /></div>
            <div className="config-field"><label>Liquidação (R$)</label><input type="number" step="0.01" value={form.liquidacao} onChange={e=>atualizar("liquidacao", Number(e.target.value))} /></div>
            <div className="config-field"><label>ISS (R$)</label><input type="number" step="0.01" value={form.iss} onChange={e=>atualizar("iss", Number(e.target.value))} /></div>
          </div>
        </div>
        <div style={{marginTop:8}}>
          <label style={{fontSize:13, color:"var(--text-dim)"}}>Outras taxas</label>
          {(form.outras_taxas||[]).map((t,i) => (
            <div key={i} style={{display:"flex", gap:8, marginTop:6}}>
              <input placeholder="Nome" value={t.nome} onChange={e=>atualizarTaxaExtra(i,"nome",e.target.value)} style={{flex:2}} />
              <input type="number" step="0.01" placeholder="Valor" value={t.valor} onChange={e=>atualizarTaxaExtra(i,"valor",Number(e.target.value))} style={{flex:1}} />
              <button onClick={()=>removerTaxaExtra(i)} className="btn-sair" style={{padding:"4px 10px"}}>×</button>
            </div>
          ))}
          <button onClick={adicionarTaxaExtra} className="btn-salvar-config" style={{marginTop:6, padding:"4px 10px", fontSize:12}}>+ Adicionar taxa</button>
        </div>
        <div style={{marginTop:10, fontSize:13, color:"var(--text-dim)"}}>Taxa Total por Contrato (calculada): <b className="mono">{formatBRL(taxaTotalPreview)}</b></div>
        <div style={{marginTop:10, display:"flex", gap:8}}>
          <button onClick={salvar} className="btn-salvar-config">Salvar</button>
          <button onClick={()=>{setForm(custo); setEditando(false);}} className="btn-sair">Cancelar</button>
        </div>
      </td>
    </tr>
  );
}

function NovoCustoOperacional({ onCriar }) {
  const vazio = { ativo:"", corretora:"", corretagem:0, emolumentos:0, registro:0, liquidacao:0, iss:0, outras_taxas:[] };
  const [form, setForm] = useState(vazio);
  const [aberto, setAberto] = useState(false);

  function atualizar(campo, valor) { setForm({ ...form, [campo]: valor }); }

  async function criar() {
    if (!form.ativo || !form.corretora) return;
    await onCriar(form);
    setForm(vazio);
    setAberto(false);
  }

  if (!aberto) {
    return <button onClick={()=>setAberto(true)} className="btn-salvar-config" style={{marginBottom:12}}>+ Cadastrar novo custo</button>;
  }

  return (
    <div className="card" style={{marginBottom:12}}>
      <div className="card-title">Novo custo operacional</div>
      <div className="config-grid">
        <div>
          <div className="config-field"><label>Ativo (ex: WIN, WDO, IND, DOL, ações...)</label><input value={form.ativo} onChange={e=>atualizar("ativo", e.target.value)} placeholder="WIN" /></div>
          <div className="config-field"><label>Corretora</label><input value={form.corretora} onChange={e=>atualizar("corretora", e.target.value)} placeholder="Clear" /></div>
          <div className="config-field"><label>Corretagem (R$)</label><input type="number" step="0.01" value={form.corretagem} onChange={e=>atualizar("corretagem", Number(e.target.value))} /></div>
        </div>
        <div>
          <div className="config-field"><label>Emolumentos (R$)</label><input type="number" step="0.01" value={form.emolumentos} onChange={e=>atualizar("emolumentos", Number(e.target.value))} /></div>
          <div className="config-field"><label>Registro (R$)</label><input type="number" step="0.01" value={form.registro} onChange={e=>atualizar("registro", Number(e.target.value))} /></div>
          <div className="config-field"><label>Liquidação (R$)</label><input type="number" step="0.01" value={form.liquidacao} onChange={e=>atualizar("liquidacao", Number(e.target.value))} /></div>
        </div>
      </div>
      <div style={{marginTop:10, display:"flex", gap:8}}>
        <button onClick={criar} className="btn-salvar-config">Cadastrar</button>
        <button onClick={()=>{setForm(vazio); setAberto(false);}} className="btn-sair">Cancelar</button>
      </div>
    </div>
  );
}

function CorretoraSelecionada({ corretora, onSalvar }) {
  const [valor, setValor] = useState(corretora || "");
  useEffect(()=>{ setValor(corretora || ""); }, [corretora]);
  return (
    <div className="config-field" style={{marginBottom:16, maxWidth:320}}>
      <label>Corretora selecionada (usada quando a operação não especifica uma)</label>
      <div style={{display:"flex", gap:8}}>
        <input value={valor} onChange={e=>setValor(e.target.value)} placeholder="Clear" />
        <button onClick={()=>onSalvar(valor)} className="btn-salvar-config" style={{padding:"6px 14px"}}>Salvar</button>
      </div>
    </div>
  );
}

function CustosOperacionais() {
  const [custos, setCustos] = useState([]);
  const [corretora, setCorretora] = useState(null);

  async function carregar() {
    try {
      const [lista, corr] = await Promise.all([
        fetch(`${API_BASE_URL}/custos-operacionais`).then(r=>r.json()),
        fetch(`${API_BASE_URL}/dashboard/corretora`).then(r=>r.json()),
      ]);
      setCustos(Array.isArray(lista) ? lista : []);
      setCorretora(corr && corr.corretora);
    } catch (e) { console.error("Erro ao carregar custos operacionais", e); }
  }
  useEffect(()=>{ carregar(); }, []);

  async function criar(dados) {
    try {
      await fetch(`${API_BASE_URL}/custos-operacionais`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(dados) });
      carregar();
    } catch (e) { console.error("Erro ao criar custo", e); }
  }
  async function editar(id, dados) {
    try {
      await fetch(`${API_BASE_URL}/custos-operacionais/${id}`, { method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(dados) });
      carregar();
    } catch (e) { console.error("Erro ao editar custo", e); }
  }
  async function excluir(id) {
    try {
      await fetch(`${API_BASE_URL}/custos-operacionais/${id}`, { method:"DELETE" });
      carregar();
    } catch (e) { console.error("Erro ao excluir custo", e); }
  }
  async function duplicar(id) {
    try {
      await fetch(`${API_BASE_URL}/custos-operacionais/${id}/duplicar`, { method:"POST" });
      carregar();
    } catch (e) { console.error("Erro ao duplicar custo", e); }
  }
  async function alternarStatus(id, ativoPadrao) {
    try {
      await fetch(`${API_BASE_URL}/custos-operacionais/${id}/status`, { method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ativo_padrao: ativoPadrao}) });
      carregar();
    } catch (e) { console.error("Erro ao alternar status do custo", e); }
  }
  async function salvarCorretora(valor) {
    try {
      await fetch(`${API_BASE_URL}/dashboard/corretora`, { method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify({corretora: valor}) });
      carregar();
    } catch (e) { console.error("Erro ao salvar corretora", e); }
  }

  return (
    <div className="card">
      <div className="card-title">Custos Operacionais</div>
      <p style={{fontSize:13, color:"var(--text-dim)", marginBottom:12}}>Corretagem, emolumentos, registro, liquidação, ISS e outras taxas — por ativo e por corretora. Todo cálculo do sistema (financeiro, simulador e backtest) usa esses valores automaticamente, sem nada fixo no código.</p>

      <CorretoraSelecionada corretora={corretora} onSalvar={salvarCorretora} />

      <NovoCustoOperacional onCriar={criar} />

      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%", borderCollapse:"collapse", fontSize:13}}>
          <thead>
            <tr style={{textAlign:"left", color:"var(--text-dim)"}}>
              <th style={{padding:"8px"}}>Ativo</th>
              <th style={{padding:"8px"}}>Corretora</th>
              <th style={{padding:"8px"}}>Taxa Total/Contrato</th>
              <th style={{padding:"8px"}}>Status</th>
              <th style={{padding:"8px"}}>Ações</th>
            </tr>
          </thead>
          <tbody>
            {custos.map(c => (
              <LinhaCustoOperacional key={c.id} custo={c} onEditar={editar} onExcluir={excluir} onDuplicar={duplicar} onAlternarStatus={alternarStatus} />
            ))}
            {custos.length === 0 && (
              <tr><td colSpan="5" style={{padding:"16px", textAlign:"center", color:"var(--text-dim)"}}>Nenhum custo cadastrado ainda.</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

                <td style={{padding:"6px 8px"}} className="mono">{formatBRL(m.prejuizo_bruto)}</td>
                <td style={{padding:"6px 8px"}} className="mono">{formatBRL(m.total_taxas_pagas)}</td>
                <td style={{padding:"6px 8px"}} className="mono">{formatBRL(m.lucro_liquido)}</td>
                <td style={{padding:"6px 8px"}} className="mono">{formatBRL(m.imposto_estimado)}</td>
                <td style={{padding:"6px 8px"}}>
                  <label style={{display:"flex", alignItems:"center", gap:6, cursor: m.total_operacoes ? "pointer" : "default", opacity: m.total_operacoes ? 1 : 0.4}}>
                    <input type="checkbox" checked={m.pago} disabled={!m.total_operacoes} onChange={() => onAlternarPago(m.mes, !m.pago)} />
                    {m.pago ? "Pago" : "Pendente"}
                  </label>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function ConfiguracaoFinanceira({ config, onSalvar }) {
  const [form, setForm] = useState(config);
  const [salvo, setSalvo] = useState(false);

  useEffect(() => { setForm(config); }, [config]);
  if (!form) return null;

  function atualizar(campo, valor) {
    setForm({ ...form, [campo]: valor });
    setSalvo(false);
  }

  async function salvar() {
    await onSalvar(form);
    setSalvo(true);
  }

  return (
    <div className="card">
      <div className="card-title">Configuração Financeira</div>
      <div className="config-grid">
        <div>
          <div className="config-field"><label>Percentual de Imposto (%)</label><input type="number" step="0.1" value={form.percentual_imposto} onChange={e=>atualizar("percentual_imposto", Number(e.target.value))} /></div>
        </div>
        <div>
          <div className="config-field"><label>Patrimônio Inicial (R$)</label><input type="number" step="0.01" value={form.patrimonio_inicial} onChange={e=>atualizar("patrimonio_inicial", Number(e.target.value))} /></div>
        </div>
      </div>
      <p style={{fontSize:12, color:"var(--text-dim)", marginTop:8}}>Corretagem, emolumentos e outras taxas por contrato agora ficam em <b>Custos Operacionais</b>, mais abaixo — específicos por ativo e corretora.</p>

      <button className="btn-salvar-config" style={{marginTop:16}} onClick={salvar}>Salvar configuração financeira</button>
      {salvo && <span className="config-salvo-msg">Configuração salva — todos os relatórios recalculam sozinhos ✓</span>}
    </div>
  );
}

function ModuloFinanceiro() {
  const [resumo, setResumo] = useState(null);
  const [dash, setDash] = useState(null);
  const [config, setConfig] = useState(null);
  const [anos, setAnos] = useState([new Date().getFullYear()]);
  const [ano, setAno] = useState(new Date().getFullYear());
  const [meses, setMeses] = useState([]);

  async function carregarTudo() {
    fetch(`${API_BASE_URL}/financeiro/resumo`).then(r=>r.json()).then(setResumo)
      .catch(e => console.error("Erro ao carregar resumo financeiro", e));
    fetch(`${API_BASE_URL}/financeiro/dashboard`).then(r=>r.json()).then(setDash)
      .catch(e => console.error("Erro ao carregar dashboard financeiro", e));
    fetch(`${API_BASE_URL}/financeiro/configuracao`).then(r=>r.json()).then(setConfig)
      .catch(e => console.error("Erro ao carregar configuração financeira", e));
    fetch(`${API_BASE_URL}/financeiro/anos`).then(r=>r.json())
      .then(r4 => setAnos(r4.anos?.length ? r4.anos : [new Date().getFullYear()]))
      .catch(e => console.error("Erro ao carregar anos disponíveis", e));
  }

  async function carregarMensal(anoAlvo) {
    try {
      const r = await fetch(`${API_BASE_URL}/financeiro/mensal?ano=${anoAlvo}`).then(r=>r.json());
      setMeses(r.meses || []);
    } catch (e) { console.error("Erro ao carregar impostos mensais", e); }
  }

  useEffect(() => { carregarTudo(); }, []);
  useEffect(() => { carregarMensal(ano); }, [ano]);

  async function salvarConfigFinanceira(novoForm) {
    try {
      const resp = await fetch(`${API_BASE_URL}/financeiro/configuracao`, {
        method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(novoForm),
      });
      const salvo = await resp.json();
      setConfig(salvo);
      // recarrega tudo, já que mudar a taxa recalcula todos os relatórios
      carregarTudo();
      carregarMensal(ano);
    } catch (e) { console.error("Erro ao salvar configuração financeira", e); }
  }

  async function alternarPago(mes, pago) {
    try {
      await fetch(`${API_BASE_URL}/financeiro/mensal/${ano}/${mes}/status`, {
        method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ pago }),
      });
      carregarMensal(ano);
    } catch (e) { console.error("Erro ao atualizar status mensal", e); }
  }

  return (
    <React.Fragment>
      <div className="section-title">Dashboard Financeiro</div>
      <DashboardFinanceiro dash={dash} />

      <div className="section-title">Painel Financeiro</div>
      <PainelFinanceiroResumo resumo={resumo} />

      <div className="section-title">Impostos Mensais</div>
      <ImpostosMensais ano={ano} anos={anos} onMudarAno={setAno} meses={meses} onAlternarPago={alternarPago} />

      <div className="section-title">
        Relatórios
        <a href={`${API_BASE_URL}/financeiro/relatorio.csv`} target="_blank" rel="noreferrer" className="btn-salvar-config" style={{marginLeft:16, textDecoration:"none", display:"inline-block", fontSize:13, padding:"6px 14px"}}>Gerar Relatório (CSV)</a>
      </div>

      <div className="section-title">Configuração Financeira</div>
      <ConfiguracaoFinanceira config={config} onSalvar={salvarConfigFinanceira} />
    </React.Fragment>
  );
}

/* ---------------------- App raiz ---------------------- */
function App() {
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  if (session === undefined) return <div className="loading-shell">Carregando...</div>;
  if (!session) return <TelaLogin onEntrou={setSession} />;
  return <Painel onSair={() => supabaseClient.auth.signOut()} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
